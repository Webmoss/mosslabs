<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fallback title only; per-route head tags are managed by react-helmet-async and baked in at prerender. -->
    <title>Moss Labs — Web, ecommerce, SEO &amp; AI for growing teams</title>
    <meta name="theme-color" content="#030F0A" />
    <meta name="author" content="Moss Labs" />
    <meta
      name="keywords"
      content="web design South Africa, website development, ecommerce, SEO, web hosting, AI automation, Jeffreys Bay"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="google-site-verification" content="eow4Nb-Td717vO8fHhMytiPZkDO1XzfFk3-h1cbNmVg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["Organization", "ProfessionalService"],
            "@id": "https://mosslabs.co.za/#organization",
            "name": "Moss Labs",
            "alternateName": "MossLabs",
            "url": "https://mosslabs.co.za/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://mosslabs.co.za/favicon.svg"
            },
            "image": "https://mosslabs.co.za/favicon.svg",
            "slogan": "Cultivating digital growth",
            "description": "Moss Labs designs and builds fast websites, ecommerce, SEO, and practical AI workflows. Based in South Africa, partnering globally.",
            "email": "info@mosslabs.co.za",
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "ZA"
            },
            "areaServed": ["ZA", "Worldwide"],
            "knowsAbout": [
              "Web Design",
              "Web Development",
              "Ecommerce",
              "Search Engine Optimization",
              "Web Hosting",
              "AI Implementation"
            ],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Moss Labs Services",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Design" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Hosting" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Ecommerce" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "SEO" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Implementation" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom Builds" } }
              ]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://mosslabs.co.za/#website",
            "url": "https://mosslabs.co.za/",
            "name": "Moss Labs",
            "description": "Design, build, and grow digital products with a team focused on performance, clarity, and measurable outcomes.",
            "inLanguage": "en-ZA",
            "publisher": { "@id": "https://mosslabs.co.za/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
